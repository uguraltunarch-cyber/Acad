<style>
/* Layout: full-height drafting surface; thin top bar, floating thumb toolbar, side/bottom sheet for layers */
:root {
  --chrome: #e9ecef;
  --panel: #ffffff;
  --panel-2: #f4f6f8;
  --ink: #1b1f24;
  --muted: #5b6570;
  --rule: #d3d8de;
  --canvas: #fbfbf8;
  --grid: rgba(27, 31, 36, .045);
  --accent: #b86e00;
  --accent-ink: #ffffff;
  --accent-soft: rgba(184, 110, 0, .12);
  --danger: #b4232c;
  --shadow: 0 1px 2px rgba(16, 20, 24, .08), 0 6px 20px rgba(16, 20, 24, .10);
  --f-ui: "Archivo", "Segoe UI", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-draw: "Archivo Narrow", "Arial Narrow", "Roboto Condensed", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chrome: #0e1114; --panel: #191e24; --panel-2: #20262d; --ink: #e5e8eb; --muted: #97a1ab;
    --rule: #2b323a; --canvas: #13171b; --grid: rgba(229, 232, 235, .04);
    --accent: #f2b23e; --accent-ink: #1d1404; --accent-soft: rgba(242, 178, 62, .16); --danger: #ff6b72;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chrome: #0e1114; --panel: #191e24; --panel-2: #20262d; --ink: #e5e8eb; --muted: #97a1ab;
  --rule: #2b323a; --canvas: #13171b; --grid: rgba(229, 232, 235, .04);
  --accent: #f2b23e; --accent-ink: #1d1404; --accent-soft: rgba(242, 178, 62, .16); --danger: #ff6b72;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--chrome); color: var(--ink); font-family: var(--f-ui); font-size: 14px;
  overflow: hidden; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--chrome); }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); }
.app > * { min-width: 0; }

/* top bar */
.bar {
  display: flex; align-items: center; gap: 12px; min-height: 52px;
  padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule); background: var(--chrome); position: relative; z-index: 5;
}
.mark { display: flex; align-items: center; gap: 8px; flex: none; }
.mark svg { display: block; }
.mark b { font-weight: 700; font-stretch: 112%; font-size: 19px; letter-spacing: -.01em; }
.file { min-width: 0; flex: 1; display: flex; flex-direction: column; line-height: 1.2; padding-left: 12px; border-left: 1px solid var(--rule); }
.file .nm { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file .meta { color: var(--muted); font-size: 12px; font-family: var(--f-num); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn {
  appearance: none; border: 1px solid var(--rule); background: var(--panel); color: var(--ink);
  font: 600 14px/1 var(--f-ui); padding: 0 14px; height: 38px; border-radius: 8px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.btn:focus-visible, .tool:focus-visible, .lyr button:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.menuwrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); width: min(320px, calc(100vw - 32px)); background: var(--panel);
  border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; z-index: 30;
}
.menu button {
  width: 100%; text-align: left; appearance: none; border: 0; background: none; color: var(--ink); cursor: pointer;
  padding: 10px 10px; border-radius: 6px; font: 500 14px/1.25 var(--f-ui); display: flex; gap: 10px; align-items: center;
}
.menu button:hover, .menu button:focus-visible { background: var(--panel-2); outline: none; }
.menu .sub { color: var(--muted); font-size: 12px; font-family: var(--f-num); display: block; }
.menu .ttl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 10px 4px; }
.menu .note { font-size: 11.5px; line-height: 1.45; color: var(--muted); padding: 4px 10px 6px; }
.menu hr { border: 0; border-top: 1px solid var(--rule); margin: 6px 4px; }

/* stage */
.stage { position: relative; overflow: hidden; background: var(--canvas); touch-action: none; }
canvas#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
.stage.measuring canvas#cv { cursor: crosshair; }
.stage.panning canvas#cv { cursor: grabbing; }
#loupe {
  position: absolute; width: 132px; height: 132px; border-radius: 50%; pointer-events: none; z-index: 4;
  border: 2px solid var(--accent); box-shadow: var(--shadow); background: var(--canvas);
}

/* floating toolbar */
.tools {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 4px; padding: 5px; background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow); z-index: 6;
}
.tool {
  appearance: none; border: 0; background: none; color: var(--ink); cursor: pointer; border-radius: 10px;
  width: 70px; height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font: 500 11.5px/1 var(--f-ui); letter-spacing: .01em;
}
.tool svg { width: 22px; height: 22px; }
.tool:hover { background: var(--panel-2); }
.tool[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* readouts */
.hud { position: absolute; z-index: 5; pointer-events: none; font-family: var(--f-num); }
.scale { left: max(14px, env(safe-area-inset-left, 0px)); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); color: var(--muted); font-size: 11px; }
.scale .bar-g { height: 7px; border: 1.5px solid var(--muted); border-top: 0; margin-top: 3px; }
.chip {
  pointer-events: auto; appearance: none; cursor: pointer; border: 1px solid var(--rule); background: var(--panel); color: var(--ink);
  font: 500 12px/1 var(--f-num); padding: 7px 10px; border-radius: 999px; box-shadow: var(--shadow);
}
.unit { right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }

/* measure card */
.mcard {
  position: absolute; z-index: 6; left: max(12px, env(safe-area-inset-left, 0px)); top: 12px; width: min(300px, calc(100% - 24px));
  background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px 12px;
}
.mcard .k { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.mcard .v { font: 500 28px/1.15 var(--f-num); margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.mcard .v small { font-size: 15px; color: var(--muted); letter-spacing: 0; }
.mcard .rows { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin-top: 8px; font: 12px/1.4 var(--f-num); color: var(--muted); }
.mcard .rows span:nth-child(even) { color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
.mcard .hint { margin-top: 8px; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.mcard .acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.mcard .acts .btn { height: 32px; padding: 0 10px; font-size: 13px; }
.mcard .acts .btn.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* layers sheet */
.sheet {
  position: absolute; z-index: 8; top: 0; right: 0; bottom: 0; width: min(340px, 100%);
  background: var(--panel); border-left: 1px solid var(--rule); box-shadow: var(--shadow);
  display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet header { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px max(14px, 0px); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
.sheet header h2 { margin: 0; font-size: 16px; font-weight: 650; flex: 1; font-stretch: 105%; }
.sheet header .count { color: var(--muted); font: 12px var(--f-num); }
.x { appearance: none; border: 0; background: var(--panel-2); color: var(--ink); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; }
.sheet .tools-row { display: flex; gap: 6px; padding: 0 14px 10px; }
.sheet input[type="search"] {
  flex: 1; min-width: 0; height: 36px; border: 1px solid var(--rule); background: var(--panel-2); color: var(--ink); border-radius: 8px; padding: 0 10px; font: 14px var(--f-ui);
}
.sheet .tools-row .btn { height: 36px; padding: 0 10px; font-size: 13px; }
.lyrs { overflow: auto; flex: 1; border-top: 1px solid var(--rule); }
.lyr { display: flex; align-items: center; gap: 10px; padding: 0 14px; min-height: 46px; border-bottom: 1px solid var(--rule); }
.lyr .sw { width: 14px; height: 14px; border-radius: 3px; flex: none; box-shadow: inset 0 0 0 1px rgba(127,127,127,.35); }
.lyr .ln { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lyr .ln small { display: block; color: var(--muted); font: 11px var(--f-num); }
.lyr.off .ln, .lyr.off .sw { opacity: .4; }
.lyr button { appearance: none; border: 0; background: none; color: var(--ink); width: 40px; height: 40px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; }
.lyr button:hover { background: var(--panel-2); }
.sheet .foot { padding: 10px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--rule); line-height: 1.45; }

/* overlays */
.busy { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: color-mix(in srgb, var(--canvas) 70%, transparent); }
.busy .box { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); padding: 18px 20px; display: flex; gap: 14px; align-items: center; max-width: calc(100% - 32px); }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--rule); border-top-color: var(--accent); animation: sp .8s linear infinite; flex: none; }
@keyframes sp { to { transform: rotate(1turn); } }
.busy b { display: block; font-size: 14px; }
.busy span { color: var(--muted); font-size: 12.5px; }
.toast {
  position: absolute; z-index: 25; left: 50%; transform: translateX(-50%); top: 14px; width: min(440px, calc(100% - 24px));
  background: var(--panel); border: 1px solid var(--rule); border-left: 4px solid var(--danger); border-radius: 10px; box-shadow: var(--shadow);
  padding: 12px 14px; font-size: 13.5px; line-height: 1.45; display: flex; gap: 10px; align-items: flex-start;
}
.toast.ok { border-left-color: var(--accent); }
.toast p { margin: 0; flex: 1; }
.drop { position: absolute; inset: 10px; z-index: 22; border: 2px dashed var(--accent); border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); font-weight: 600; font-size: 16px; pointer-events: none; }

@media (max-width: 640px) {
  .sheet { top: auto; width: 100%; height: min(72%, 560px); border-left: 0; border-top: 1px solid var(--rule); border-radius: 16px 16px 0 0; }
  .tool { width: 62px; }
  .mark b { display: none; }
  .file { padding-left: 10px; }
  .btn .lbl-long { display: none; }
}
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
</style>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;

/* ================= ACI colour table ================= */
const ACI = (() => {
  const t = new Array(256);
  const fixed = { 1: [255, 0, 0], 2: [255, 255, 0], 3: [0, 255, 0], 4: [0, 255, 255], 5: [0, 0, 255], 6: [255, 0, 255], 7: [255, 255, 255], 8: [128, 128, 128], 9: [192, 192, 192] };
  const hsv = (h, s, v) => {
    const f = (n) => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
    return [Math.round(f(5)), Math.round(f(3)), Math.round(f(1))];
  };
  const V = [255, 204, 153, 127, 76];
  for (let i = 0; i < 256; i++) {
    if (fixed[i]) t[i] = fixed[i];
    else if (i >= 10 && i <= 249) { const hue = (Math.floor(i / 10) - 1) * 15, sub = i % 10; t[i] = hsv(hue, sub % 2 ? 0.5 : 1, V[sub >> 1]); }
    else if (i >= 250) { const g = [51, 91, 132, 173, 214, 255][i - 250]; t[i] = [g, g, g]; }
    else t[i] = [255, 255, 255];
  }
  return t;
})();

/* ================= text helpers ================= */
function cleanCommon(s) {
  return s.replace(/\\U\+([0-9A-Fa-f]{4})/g, (m, h) => String.fromCharCode(parseInt(h, 16)))
    .replace(/%%[cC]/g, 'Ø').replace(/%%[dD]/g, '°').replace(/%%[pP]/g, '±').replace(/%%%/g, '%').replace(/%%[uUoOkK]/g, '');
}
function cleanMText(s) {
  s = cleanCommon(s)
    .replace(/\\\\/g, '\u0000').replace(/\\\{/g, '\u0001').replace(/\\\}/g, '\u0002')
    .replace(/\\P/g, '\n').replace(/\\~/g, ' ')
    .replace(/\\S([^;]*?)[\^\/#]([^;]*?);/g, '$1/$2')
    .replace(/\\[ACcFfHhQqTtWwp][^;\\]*;/g, '')
    .replace(/\\[LlOoKkNX]/g, '')
    .replace(/[{}]/g, '')
    .replace(/\u0000/g, '\\').replace(/\u0001/g, '{').replace(/\u0002/g, '}');
  return s;
}

/* ================= DXF parser ================= */
const CP = { ANSI_1250: 'windows-1250', ANSI_1251: 'windows-1251', ANSI_1252: 'windows-1252', ANSI_1253: 'windows-1253', ANSI_1254: 'windows-1254', ANSI_1255: 'windows-1255', ANSI_1256: 'windows-1256', ANSI_1257: 'windows-1257', ANSI_1258: 'windows-1258', ANSI_874: 'windows-874', ANSI_932: 'shift_jis', ANSI_936: 'gbk', ANSI_949: 'euc-kr', ANSI_950: 'big5' };
function decodeDxf(bytes) {
  const head = new TextDecoder('latin1').decode(bytes.subarray(0, Math.min(bytes.length, 250000)));
  if (head.startsWith('AutoCAD Binary DXF')) throw new Error('Bu bir ikili (binary) DXF. Lütfen dosyayı ASCII DXF olarak kaydedin.');
  const ver = (/\$ACADVER\s*\r?\n\s*1\s*\r?\n\s*(AC\d+)/.exec(head) || [])[1] || '';
  const cp = ((/\$DWGCODEPAGE\s*\r?\n\s*3\s*\r?\n\s*(\S+)/.exec(head) || [])[1] || '').toUpperCase();
  if (ver && ver >= 'AC1021') return { text: new TextDecoder('utf-8').decode(bytes), ver };
  if (ver) { try { return { text: new TextDecoder(CP[cp] || 'windows-1254').decode(bytes), ver }; } catch (e) { /* fallthrough */ } }
  try { return { text: new TextDecoder('utf-8', { fatal: true }).decode(bytes), ver }; }
  catch (e) { return { text: new TextDecoder('windows-1254').decode(bytes), ver }; }
}

function parseDxf(bytes) {
  const { text, ver } = decodeDxf(bytes);
  const lines = text.split(/\r\n|\r|\n/);
  const n = Math.floor(lines.length / 2);
  const C = new Int32Array(n), V = new Array(n);
  let m = 0;
  for (let i = 0; i + 1 < lines.length; i += 2) {
    const c = parseInt(lines[i], 10);
    if (Number.isNaN(c)) { i--; continue; }
    C[m] = c; V[m] = lines[i + 1]; m++;
  }
  const model = { units: 0, ver, layers: [], blocks: {}, ents: [], skipped: {} };
  let i = 0;
  const f = (k) => parseFloat(V[k]) || 0;
  const recsUntil = (endName) => {
    // returns raw records [{type, s, e}] (index ranges, exclusive of the 0 code)
    const out = [];
    while (i < m) {
      if (C[i] === 0) {
        const t = V[i].trim();
        if (t === endName || t === 'ENDSEC') break;
        const s = i + 1; i++;
        while (i < m && C[i] !== 0) i++;
        out.push({ type: t, s, e: i });
      } else i++;
    }
    return out;
  };
  while (i < m) {
    if (C[i] === 0 && V[i].trim() === 'SECTION') {
      i++;
      const name = (C[i] === 2) ? V[i].trim() : ''; i++;
      if (name === 'HEADER') {
        while (i < m && !(C[i] === 0 && V[i].trim() === 'ENDSEC')) {
          if (C[i] === 9 && V[i].trim() === '$INSUNITS' && C[i + 1] === 70) model.units = parseInt(V[i + 1], 10) || 0;
          i++;
        }
      } else if (name === 'TABLES') {
        while (i < m && !(C[i] === 0 && V[i].trim() === 'ENDSEC')) {
          if (C[i] === 0 && V[i].trim() === 'LAYER') {
            const s = ++i; while (i < m && C[i] !== 0) i++;
            const L = { name: '0', c: 7, off: false };
            for (let k = s; k < i; k++) {
              if (C[k] === 2) L.name = V[k].trim();
              else if (C[k] === 62) { const c = parseInt(V[k], 10); L.c = Math.abs(c) || 7; if (c < 0) L.off = true; }
              else if (C[k] === 70) { if (parseInt(V[k], 10) & 1) L.off = true; }
              else if (C[k] === 420) L.rgb = parseInt(V[k], 10) & 0xffffff;
            }
            model.layers.push(L);
          } else i++;
        }
      } else if (name === 'BLOCKS') {
        while (i < m && !(C[i] === 0 && V[i].trim() === 'ENDSEC')) {
          if (C[i] === 0 && V[i].trim() === 'BLOCK') {
            const s = ++i; while (i < m && C[i] !== 0) i++;
            let bn = '', bx = 0, by = 0;
            for (let k = s; k < i; k++) { if (C[k] === 2) bn = V[k].trim(); else if (C[k] === 10) bx = f(k); else if (C[k] === 20) by = f(k); }
            const recs = recsUntil('ENDBLK');
            if (C[i] === 0 && V[i].trim() === 'ENDBLK') { i++; while (i < m && C[i] !== 0) i++; }
            if (/^\*paper_space/i.test(bn)) continue;
            model.blocks[bn] = { bx, by, ents: buildEnts(recs, C, V, model.skipped, true) };
          } else i++;
        }
      } else if (name === 'ENTITIES') {
        const recs = recsUntil('ENDSEC');
        model.ents = buildEnts(recs, C, V, model.skipped, false);
      } else {
        while (i < m && !(C[i] === 0 && V[i].trim() === 'ENDSEC')) i++;
      }
    } else i++;
  }
  return model;
}

function buildEnts(recs, C, V, skipped, inBlock) {
  const out = [];
  const f = (k) => parseFloat(V[k]) || 0;
  for (let r = 0; r < recs.length; r++) {
    const R = recs[r];
    const g = (code, def) => { for (let k = R.s; k < R.e; k++) if (C[k] === code) return V[k]; return def; };

    const tc = g(420); if (tc !== undefined) { base.c = -1; base.rgb = parseInt(tc, 10) & 0xffffff; }
    if (gf(230, 1) < -0.5) base.neg = 1;
    let e = null;
    try {
      switch (R.type) {
        case 'LINE': e = { k: 'L', a: [gf(10), gf(20), gf(11), gf(21)] }; break;
        case 'LWPOLYLINE': {
          const p = [];
          for (let k = R.s; k < R.e; k++) {
            if (C[k] === 10) p.push(f(k), 0, 0);
            else if (C[k] === 20 && p.length) p[p.length - 2] = f(k);
            else if (C[k] === 42 && p.length) p[p.length - 1] = f(k);

    const umap = { 1: 'inç', 2: 'ft', 4: 'mm', 5: 'cm', 6: 'm' };
    let un = umap[sc.units];
    if (!un) { const w = Math.max(sc.ext[2] - sc.ext[0], sc.ext[3] - sc.ext[1]); un = w > 4000 ? 'mm' : w > 300 ? 'cm' : 'm'; }
    setUnit(un);
    $('fname').textContent = opts.label || name;
    const used = sc.layers.filter(l => l.count > 0).length;
    $('fmeta').textContent = [docInfo.kind + (model.ver ? ' ' + model.ver : ''), sc.entCount.toLocaleString('tr-TR') + ' nesne', used + ' katman'].join(' · ');
    colorCache.clear();
    fit();
    if (!$('sheet').hidden) renderLayers();
    if (opts.remember) remember(name, bytes);
  } catch (err) {
    toast(err.message || String(err));
  } finally { busy(false); }
}

$('openBtn').addEventListener('click', (e) => { e.stopPropagation(); const m = $('menu'); m.hidden = !m.hidden; $('openBtn').setAttribute('aria-expanded', !m.hidden); if (!m.hidden) listRecent(); });
function closeMenu() { $('menu').hidden = true; $('openBtn').setAttribute('aria-expanded', 'false'); }
document.addEventListener('click', (e) => { if (!e.target.closest('.menuwrap')) closeMenu(); });
$('pickFile').addEventListener('click', () => { closeMenu(); $('fileIn').click(); });
$('openSample').addEventListener('click', () => { closeMenu(); openSample(); });
$('fileIn').addEventListener('change', async () => {
  const f = $('fileIn').files[0]; if (!f) return;
  const buf = new Uint8Array(await f.arrayBuffer());
  $('fileIn').value = '';
  openBytes(f.name, buf, { remember: true });
});
function openSample() {
  const txt = $('sample-dxf').textContent.replace(/^\s+/, '');
  openBytes('ornek-daire.dxf', new TextEncoder().encode(txt), { label: 'Örnek daire planı' });
}

// drag & drop
let dragDepth = 0;
stage.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; $('drop').hidden = false; });
stage.addEventListener('dragover', (e) => e.preventDefault());
stage.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('drop').hidden = true; } });
stage.addEventListener('drop', async (e) => {
  e.preventDefault(); dragDepth = 0; $('drop').hidden = true;
  const f = e.dataTransfer.files[0]; if (!f) return;
  openBytes(f.name, new Uint8Array(await f.arrayBuffer()), { remember: true });
});

/* recent files in this browser (IndexedDB) */
function idb() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open('acad', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('files', { keyPath: 'name' });
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
}
async function remember(name, bytes) {
  if (bytes.length > 60e6) return;
  try {
    const db = await idb();
    const tx = db.transaction('files', 'readwrite'), st = tx.objectStore('files');
    st.put({ name, date: Date.now(), size: bytes.length, data: bytes.slice().buffer });
    const all = await new Promise(r => { const q = st.getAll(); q.onsuccess = () => r(q.result || []); q.onerror = () => r([]); });
    all.sort((a, b) => b.date - a.date).slice(6).forEach(x => st.delete(x.name));
  } catch (e) { /* storage unavailable */ }
}
async function listRecent() {
  const wrap = $('recentWrap'), box = $('recent');
  try {
    const db = await idb();
    const all = await new Promise(r => { const q = db.transaction('files').objectStore('files').getAll(); q.onsuccess = () => r(q.result || []); q.onerror = () => r([]); });
    all.sort((a, b) => b.date - a.date);
    box.innerHTML = '';
    for (const f of all.slice(0, 6)) {
      const b = document.createElement('button');
      const d = new Date(f.date);
      b.innerHTML = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 2h7l3 3v11H4z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span></span>';
      const sp = b.querySelector('span'); sp.textContent = f.name;
      const sub = document.createElement('span'); sub.className = 'sub';
      sub.textContent = (f.size / 1048576).toLocaleString('tr-TR', { maximumFractionDigits: 1 }) + ' MB · ' + d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
      sp.appendChild(sub);
      b.addEventListener('click', () => { closeMenu(); openBytes(f.name, new Uint8Array(f.data), { remember: true }); });
      box.appendChild(b);
    }
    wrap.hidden = !all.length;
  } catch (e) { wrap.hidden = true; }
}

/* ================= boot ================= */
readTheme();
resize();
openSample();
async function openUrl(url, name) {
  try { busy(true, 'Açılıyor…', name); const r = await fetch(url); if (!r.ok) throw new Error('Dosya okunamadı (' + r.status + ').'); await openBytes(name, new Uint8Array(await r.arrayBuffer()), { remember: true }); }
  catch (err) { busy(false); toast(err.message || String(err)); }
}
window.__acad = { get scene() { return scene; }, openBytes, openUrl, view };
})();
