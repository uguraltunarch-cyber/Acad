name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Dosyayı adlandır
        run: cp app/build/outputs/apk/release/app-release.apk "Acad-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Acad-apk
          path: Acad-*.apk

      - name: Sürüm yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Acad 1.0.${{ github.run_number }}
          body: Telefona indirip açın. İlk kurulumda "bilinmeyen kaynaklardan yükleme" izni istenir.
          files: Acad-*.apk
